<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftBite | Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">🍕 SwiftBite</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Restaurants</a>
            <a href="#">Offers</a>
            <a href="#">Sign In</a>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Craving something delicious?</h1>
            <p>Get food delivery to your doorstep within minutes. We deliver the best food in town, hot and fresh.</p>
            <div class="search-bar">
                <input type="text" placeholder="Enter your delivery address">
                <button>Find Food</button>
            </div>
        </div>
        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop" alt="Delicious Food">
        </div>
    </main>

    <!-- Chat Widget Button -->
    <button id="chat-toggle-btn" class="chat-toggle-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>
    </button>

    <!-- Chatbot Window -->
    <div id="chat-window" class="chat-window hidden">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="bot-avatar">🤖</div>
                <div>
                    <h3>SwiftSupport</h3>
                    <span class="status">Online</span>
                </div>
            </div>
            <button id="close-chat-btn" class="close-btn">&times;</button>
        </div>
        
        <div id="chat-messages" class="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    Hi there! 👋 I'm the SwiftBite virtual assistant. How can I help you with your order today?
                </div>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-msg-btn" class="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
